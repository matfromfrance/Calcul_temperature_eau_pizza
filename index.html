<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculateur température - Pizza</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(520px,100%);background:white;border-radius:24px;padding:28px;box-shadow:0 10px 35px #0001}h1{margin:0 0 8px;text-align:center;font-size:28px}.sub{text-align:center;color:#6b7280;margin-bottom:24px}label{display:block;font-weight:700;margin:16px 0 8px}input{width:100%;font-size:26px;padding:14px;border:2px solid #d1d5db;border-radius:14px;text-align:center;outline:0}input:focus{border-color:#2563eb}.result{margin-top:24px;background:#eff6ff;border-radius:18px;padding:18px;text-align:center;color:#2563eb;font-weight:700}.formula{text-align:center;color:#6b7280;font-size:14px;margin-top:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#e5e7eb;font-size:16px;font-weight:700}
</style>
</head>
<body>
<main class="card">
<h1>🍕 Calculateur de température</h1>
<div class="sub">Remplis n'importe quels 2 champs : le 3e est calculé automatiquement.</div>

<label for="flour">🌾 Température de la farine (°C)</label>
<input id="flour" type="number" step="0.1" inputmode="decimal" placeholder="Ex. 22">

<label for="room">🏠 Température de la pièce (°C)</label>
<input id="room" type="number" step="0.1" inputmode="decimal" placeholder="Ex. 24">

<label for="water">💧 Température de l'eau (°C)</label>
<input id="water" type="number" step="0.1" inputmode="decimal" placeholder="Ex. 12">

<div class="result" id="status">Entrez 2 températures</div>
<div class="formula">58 = farine + pièce + eau</div>
<button onclick="resetCalc()">Réinitialiser</button>
</main>

<script>
const f=document.getElementById('flour'), r=document.getElementById('room'), w=document.getElementById('water'), status=document.getElementById('status');
function n(x){const v=parseFloat(x.value);return Number.isFinite(v)?v:null}
function calc(){
 const F=n(f),R=n(r),W=n(w), count=[F,R,W].filter(v=>v!==null).length;
 if(count<2){status.textContent='Entrez 2 températures';return}
 if(count===2){
  if(F===null){f.value=(58-W-R).toFixed(1);status.textContent='🌾 Farine calculée automatiquement'}
  else if(R===null){r.value=(58-W-F).toFixed(1);status.textContent='🏠 Température de la pièce calculée automatiquement'}
  else {w.value=(58-F-R).toFixed(1);status.textContent='💧 Température de l’eau calculée automatiquement'}
 } else status.textContent='Les 3 températures sont renseignées';
}
[f,r,w].forEach(x=>x.addEventListener('input',calc));
function resetCalc(){f.value=r.value=w.value='';status.textContent='Entrez 2 températures';f.focus()}
</script>
</body>
</html>
