<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculateur température - Pizza</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(520px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 10px 35px #0001}
h1{margin:0 0 8px;text-align:center;font-size:28px}
.sub{text-align:center;color:#6b7280;margin-bottom:24px}
label{display:block;font-weight:700;margin:16px 0 8px}
input{width:100%;font-size:26px;padding:14px;border:2px solid #d1d5db;border-radius:14px;text-align:center;outline:0;transition:border-color .2s, background-color .2s}
input:focus{border-color:#2563eb}
input.auto-calc{background-color:#eff6ff;border-color:#93c5fd;color:#1e40af}
.result{margin-top:24px;background:#f3f4f6;border-radius:18px;padding:18px;text-align:center;color:#374151;font-weight:700;transition:background .2s, color .2s}
.result.active{background:#eff6ff;color:#2563eb}
.formula{text-align:center;color:#6b7280;font-size:14px;margin-top:16px}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#e5e7eb;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s}
button:hover{background:#d1d5db}
</style>
</head>
<body>
<main class="card">
<h1>🍕 Calculateur de température (Merci Dav) </h1>
<div class="sub">Entrez 2 températures : la 3ᵉ se calcule automatiquement.</div>

<label for="flour">🌾 Température de la farine (°C)</label>
<input id="flour" type="number" step="0.1" inputmode="decimal" placeholder="Ex. 22">

<label for="room">🏠 Température de la pièce (°C)</label>
<input id="room" type="number" step="0.1" inputmode="decimal" placeholder="Ex. 24">

<label for="water">💧 Température de l'eau (°C)</label>
<input id="water" type="number" step="0.1" inputmode="decimal" placeholder="Ex. 12">

<div class="result" id="status">Entrez 2 températures</div>
<div class="formula">Base de calcul : 58 = Farine + Pièce + Eau</div>
<button onclick="resetCalc()">Réinitialiser</button>
</main>

<script>
const inputs = [
  { el: document.getElementById('flour'), name: '🌾 Farine' },
  { el: document.getElementById('room'), name: '🏠 Pièce' },
  { el: document.getElementById('water'), name: '💧 Eau' }
];
const status = document.getElementById('status');
let userHistory = [];

function parseVal(input) {
  const v = parseFloat(input.value);
  return Number.isFinite(v) ? v : null;
}

function handleInput(e) {
  const target = e.target;
  
  // Track order of user inputs
  userHistory = userHistory.filter(item => item !== target);
  if (target.value !== '') {
    userHistory.push(target);
  }

  // Reset auto-calculated field styling when user edits manually
  inputs.forEach(i => i.el.classList.remove('auto-calc'));

  if (userHistory.length >= 2) {
    // Keep the last two manually edited fields
    const activeInputs = userHistory.slice(-2);
    const targetToCalc = inputs.find(i => !activeInputs.includes(i.el));

    const v1 = parseVal(activeInputs[0]);
    const v2 = parseVal(activeInputs[1]);

    if (v1 !== null && v2 !== null) {
      const result = (58 - v1 - v2).toFixed(1);
      targetToCalc.el.value = result;
      targetToCalc.el.classList.add('auto-calc');
      
      status.textContent = `${targetToCalc.name} calculée : ${result} °C`;
      status.classList.add('active');
      return;
    }
  }

  status.textContent = 'Entrez 2 températures';
  status.classList.remove('active');
}

inputs.forEach(i => i.el.addEventListener('input', handleInput));

function resetCalc() {
  inputs.forEach(i => {
    i.el.value = '';
    i.el.classList.remove('auto-calc');
  });
  userHistory = [];
  status.textContent = 'Entrez 2 températures';
  status.classList.remove('active');
  inputs[0].el.focus();
}
</script>
</body>
</html>
